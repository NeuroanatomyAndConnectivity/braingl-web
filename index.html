<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>brainGL web</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23101014'/%3E%3Cpath d='M16 16 L16 3 A13 13 0 0 1 27.3 9.5 Z' fill='%23e5484d'/%3E%3Cpath d='M16 16 L27.3 9.5 A13 13 0 0 1 22.5 27.3 Z' fill='%2346a758'/%3E%3Cpath d='M16 16 L22.5 27.3 A13 13 0 0 1 4.7 9.5 Z' fill='%233e63dd'/%3E%3Cpath d='M16 16 L4.7 9.5 A13 13 0 0 1 16 3 Z' fill='%23f5d90a'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #0d0d0f;
        --panel-bg: rgba(18, 18, 21, 0.94);
        --panel-border: rgba(255, 255, 255, 0.06);
        --panel-divider: rgba(255, 255, 255, 0.05);
        --text: #e8e8ea;
        --text-dim: #9a9aa3;
        --text-mute: #6a6a73;
        --accent: #7aa2ff;
        --accent-soft: rgba(122, 162, 255, 0.18);
        --control-bg: rgba(255, 255, 255, 0.05);
        --control-border: rgba(255, 255, 255, 0.09);
        --control-border-hover: rgba(255, 255, 255, 0.18);
        --danger: #ff7a7a;
        --warn: #f0b860;
        --panel-w: 300px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 13px; -webkit-font-smoothing: antialiased; }
      #banner { position: fixed; top: 0; left: 0; right: 0; padding: 12px; background: #c33; color: #fff; display: none; z-index: 100; }

      /* ---------------------------------------------------------------- shell */
      #shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
      #topbar { flex: none; height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 12px;
        background: #0b0b0d; border-bottom: 1px solid var(--panel-border); }
      #brand { font-weight: 650; letter-spacing: 0.02em; }
      #brand span { color: var(--text-dim); font-weight: 400; }
      #tabs { display: flex; gap: 2px; background: var(--control-bg); border: 1px solid var(--control-border); border-radius: 8px; padding: 2px; }
      #tabs button { all: unset; cursor: pointer; padding: 4px 12px; border-radius: 6px; color: var(--text-dim); font-size: 12.5px; }
      #tabs button:hover { color: var(--text); }
      #tabs button.active { background: var(--accent-soft); color: var(--text); }
      #tabs button:focus-visible { outline: 1px solid var(--accent); }
      #topbar .spacer { flex: 1; }
      #topbar a { color: var(--text-dim); text-decoration: none; font-size: 12px; }
      #topbar a:hover { color: var(--text); }
      #shell-panel-toggle { all: unset; cursor: pointer; width: 28px; height: 26px; border: 1px solid var(--control-border); border-radius: 6px;
        display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
      #shell-panel-toggle:hover { color: var(--text); border-color: var(--control-border-hover); }
      #blender-export { all: unset; cursor: pointer; padding: 4px 10px; border: 1px solid var(--control-border); border-radius: 6px; color: var(--text-dim); font-size: 12px; }
      #blender-export:hover { color: var(--text); border-color: var(--control-border-hover); }
      #blender-export:disabled { opacity: 0.5; cursor: progress; }
      #blender-export:focus-visible, #shell-panel-toggle:focus-visible { outline: 1px solid var(--accent); }
      #stage { flex: 1; min-height: 0; position: relative; }
      .workspace { position: absolute; inset: 0; display: flex; }
      .workspace[hidden] { display: none; }
      .ws-view { flex: 1; min-width: 0; position: relative; overflow: hidden; }
      .ws-view.dragging::after { content: "Drop to load"; position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 12px;
        display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); background: rgba(10, 12, 20, 0.6); pointer-events: none; }
      .ws-panel { flex: none; width: var(--panel-w); background: var(--panel-bg); border-left: 1px solid var(--panel-border); overflow-y: auto;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.12) transparent; }
      body.panel-closed .ws-panel { display: none; }
      .view-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

      /* ---------------------------------------------------------------- panel */
      .panel { padding: 0 16px 28px; }
      .panel-titlebar { position: sticky; top: 0; z-index: 2; margin: 0 -16px; padding: 11px 16px 9px; background: rgba(14, 14, 17, 0.92);
        backdrop-filter: blur(8px); border-bottom: 1px solid var(--panel-divider); }
      .panel-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
      .panel-heading { display: flex; align-items: center; gap: 8px; width: 100%; margin: 14px 0 6px; padding: 6px 2px 8px; background: transparent;
        border: none; border-bottom: 1px solid var(--panel-divider); font: inherit; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.1em; color: var(--text-dim); cursor: pointer; text-align: left; }
      .panel-heading:hover { color: var(--text); }
      .panel-heading:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
      .panel-heading-caret { width: 10px; font-size: 10px; color: var(--text-mute); transition: transform 0.15s ease; }
      .panel-section.collapsed .panel-heading-caret { transform: rotate(-90deg); }
      .panel-section.collapsed .panel-section-body { display: none; }
      .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; padding: 4px 2px; min-height: 28px; }
      .row-label { color: var(--text-dim); font-size: 12px; }
      .row-slider { grid-template-columns: 1fr 64px; }
      .row-slider input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); height: 16px; }
      .row-value { width: 64px; background: var(--control-bg); border: 1px solid var(--control-border); border-radius: 5px; color: var(--text);
        font: inherit; font-size: 11.5px; font-variant-numeric: tabular-nums; padding: 2px 4px; text-align: right; }
      .row-value::-webkit-inner-spin-button { display: none; }
      .row select { max-width: 150px; background: #1b1b20; border: 1px solid var(--control-border); border-radius: 5px; color: var(--text);
        font: inherit; font-size: 12px; padding: 3px 4px; }
      .row select:hover, .row-value:hover { border-color: var(--control-border-hover); }
      .row input[type="color"] { width: 34px; height: 22px; padding: 0; border: 1px solid var(--control-border); border-radius: 5px; background: none; cursor: pointer; }
      .row-check { grid-template-columns: 1fr; }
      .row-check label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .row-check input { accent-color: var(--accent); margin: 0; }
      .row-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
      .btn { flex: 1 1 auto; background: var(--control-bg); border: 1px solid var(--control-border); border-radius: 6px; color: var(--text);
        font: inherit; font-size: 12px; padding: 5px 8px; cursor: pointer; white-space: nowrap; }
      .btn:hover { border-color: var(--control-border-hover); background: rgba(255, 255, 255, 0.08); }
      .btn.active, .btn-primary { background: var(--accent-soft); border-color: rgba(122, 162, 255, 0.35); }
      .btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
      .row-note { display: block; color: var(--text); font-size: 12px; line-height: 1.45; }
      .row-note:empty { display: none; }
      .dim { color: var(--text-dim); }
      .warn { color: var(--warn); }
      .err { color: var(--danger); }
      .legend-bar { grid-column: 1 / -1; height: 10px; border-radius: 3px; border: 1px solid var(--control-border); }

      /* ------------------------------------------------------------------ HUD */
      .hud-toolbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
      .hud-group { display: flex; background: rgba(16, 16, 20, 0.82); border: 1px solid var(--control-border); border-radius: 8px; padding: 2px; backdrop-filter: blur(8px); }
      .hud-group button { all: unset; cursor: pointer; padding: 4px 9px; border-radius: 6px; color: var(--text-dim); font-size: 12px; }
      .hud-group button:hover { color: var(--text); }
      .hud-group button.active { background: var(--accent-soft); color: var(--text); }
      .hud-group button:focus-visible { outline: 1px solid var(--accent); }
      .hud-status { position: absolute; left: 8px; bottom: 6px; max-width: calc(100% - 240px); font-size: 11.5px; color: var(--text-dim); pointer-events: none;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(12, 12, 15, 0.72); padding: 4px 8px; border-radius: 6px; }
      .hud-status:empty { display: none; }
      .hud-status b { color: var(--text); font-weight: 600; }
      .hud-legend { position: absolute; right: 8px; bottom: 6px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim);
        font-variant-numeric: tabular-nums; pointer-events: none; background: rgba(12, 12, 15, 0.72); padding: 4px 8px; border-radius: 6px; }
      .hud-legend div { width: 120px; height: 9px; border-radius: 3px; border: 1px solid rgba(255, 255, 255, 0.25); }
      .hud-progress { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 260px; padding: 14px 16px; display: none;
        background: rgba(16, 16, 20, 0.92); border: 1px solid var(--control-border); border-radius: 10px; }
      .hud-progress-text { margin-bottom: 8px; }
      .hud-progress-bar { height: 4px; background: var(--control-bg); border-radius: 2px; overflow: hidden; }
      .hud-progress-bar > div { height: 100%; background: var(--accent); width: 0; transition: width 0.1s linear; }
      .hud-progress-bar > div.indeterminate { animation: pulse 1.1s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .hud-progress-bar > div.indeterminate { animation: none; } }
      .hud-drop { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); color: var(--text-mute); font-size: 12px; pointer-events: none; text-align: center; }
      .inset-frame { position: absolute; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 4px; pointer-events: none; display: none; }
      .inset-frame span { position: absolute; left: -1px; top: -21px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
        white-space: nowrap; background: rgba(12, 12, 15, 0.72); padding: 3px 7px; border-radius: 5px 5px 0 0; }
    </style>
  </head>
  <body>
    <div id="banner"></div>
    <div id="shell">
      <header id="topbar">
        <div id="brand">brainGL <span>web</span></div>
        <nav id="tabs" aria-label="Workspaces"></nav>
        <div class="spacer"></div>
        <a id="docs-link" hidden href="docs/" target="_blank" rel="noopener" title="Documentation and tutorials">Docs</a>
        <a href="https://doi.org/10.3389/fnins.2014.00015" target="_blank" rel="noopener" title="Böttger, Schurade, Jakobsen, Schaefer & Margulies (2014) Connexel visualization. Front. Neurosci. 8:15">Böttger et al. 2014</a>
        <button id="blender-export" type="button" title="Download the current scene (surface, glyphs, connections or arrows) as a zip that the bundled Blender script imports">Export for Blender</button>
        <button id="shell-panel-toggle" type="button" title="Show / hide the side panel" aria-label="Toggle side panel">☰</button>
      </header>
      <main id="stage"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
