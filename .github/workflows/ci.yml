name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Data tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy nibabel pytest
      - run: pytest tests/python -q

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict

  e2e:
    name: Browser smoke test (headless Chrome, software WebGL)
    runs-on: ubuntu-latest
    # Hosted runners have no GPU: Chrome renders WebGL with SwiftShader, and the smoke test lowers
    # the connexel budget and raises its time limits when it detects a software renderer (see the
    # header of tests/e2e/smoke.mjs).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          CHROME_PATH: google-chrome
      - name: Upload screenshots of failed checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/.artifacts/
          if-no-files-found: ignore

  blender:
    name: Blender import script (bpy module)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bpy numpy
      - run: python tests/blender/test_import.py
