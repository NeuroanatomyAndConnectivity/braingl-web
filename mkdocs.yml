site_name: brainGL web
site_description: >-
  Connectivity glyphs, connection bundling and directionality maps for dense
  brain connectivity on cortical surfaces, in the browser.
site_url: https://neuroanatomyandconnectivity.github.io/braingl-web/docs/
repo_url: https://github.com/NeuroanatomyAndConnectivity/braingl-web
repo_name: NeuroanatomyAndConnectivity/braingl-web
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
  - Tutorials:
      - Connectivity glyphs: tutorials/glyphs.md
      - Manual parcellation: tutorials/parcellation.md
      - Connections and bundling: tutorials/bundling.md
      - Your own data: tutorials/own-data.md
      - Directionality: tutorials/directionality.md
      - Blender export: tutorials/blender.md
  - How-to guides:
      - Load a brainGL glyphset: how-to/load-braingl-glyphset.md
      - Make publication figures: how-to/figures.md
      - Script the viewer: how-to/scripting.md
      - Deploy your own copy: how-to/deploy.md
  - Reference:
      - Glyph types: reference/glyph-types.md
      - Parameters: reference/parameters.md
      - Data formats: reference/data-formats.md
      - Mouse and keyboard: reference/mouse-keyboard.md
      - Command-line tools: reference/cli.md
      - Blender scene format: reference/blender-scene-format.md
      - Limits: reference/limits.md
  - Explanation:
      - How it works: explanation/how-it-works.md
      - Differences from brainGL: explanation/differences-from-braingl.md
      - Background: explanation/background.md
  - Development:
      - Architecture: development/architecture.md
      - Testing: development/testing.md
      - Contributing: development/contributing.md
      - Vendored Directionality: development/vendored-directionality.md
  - About:
      - Citing: about/citing.md
      - License: about/license.md
      - Changelog: about/changelog.md
  - Open the app: https://neuroanatomyandconnectivity.github.io/braingl-web/
